<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030303">
  <meta name="format-detection" content="telephone=no">
  <title>Labs — UNLEESH Studio</title>
  <meta name="description" content="UNLEESH Labs: visual engineering and generative prototypes. An experimental archive of web motion, AI motion imagery and commercial image generation.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,300..800&family=Doto:ROND,wght@100,700;100,900&family=Inter:wght@300;400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/lab.css">
</head>
<body data-page="lab">

<main>
  <!-- 8.2 header composition -->
  <header class="lab-head">
    <h1 data-reveal-lines>LABS</h1>
    <p class="lh-sub" data-reveal-lines>VISUAL ENGINEERING<br>GENERATIVE PROTOTYPES</p>
    <div class="lh-row"><span>CORE</span><span>EXPERIMENTAL ARCHIVE</span></div>
    <p class="lh-gloss">（ Laboratories ）</p>
  </header>

  <!-- 8.3 filter tabs -->
  <div class="lab-filters" role="tablist">
    <button class="is-active" data-cat="all">ALL</button>
    <button data-cat="web">Web Motion Design</button>
    <button data-cat="motion">Motion Image Generation</button>
    <button data-cat="commercial">High-End Commercial Image Generation</button>
  </div>

  <!-- 8.4 grid (25 cards rendered by JS) -->
  <div class="lab-grid" aria-live="polite"></div>

  <!-- 8.5 coming soon marquee -->
  <div class="marquee marquee-band mq-display mq-dot" data-speed="40" data-dir="left">
    <div class="mq-track">
      <span class="mq-item"><span>COMING SOON</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 2h12M6 22h12M7 2c0 5 4 6 5 8-1 2-5 3-5 8M17 2c0 5-4 6-5 8 1 2 5 3 5 8"/></svg></span>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/Flip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrambleTextPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
