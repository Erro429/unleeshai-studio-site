server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml
               application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Pages: always revalidate so a deploy shows up at once.
    # /about works as well as /about.html (the .html URLs stay canonical).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri.html $uri/ =404;
    }

    # Code is not fingerprinted, so keep its cache short
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Stills, loops, fonts and icons change rarely
    location ~* \.(?:webp|jpg|jpeg|png|svg|ico|mp4|webm|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Nothing hidden is ever served (except /.well-known, used for domain checks)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
